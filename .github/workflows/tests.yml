name: Tests

on: [ push, pull_request ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]
        composer-dependency: [ prefer-stable ]

    name: "PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.composer-dependency }}"
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.8
        env:
          MYSQL_DATABASE: web
          MYSQL_USER: web
          MYSQL_PASSWORD: web
          MYSQL_ROOT_PASSWORD: root
        ports: [ 3306 ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer global update
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --no-interaction --no-scripts --no-progress --prefer-dist --${{ matrix.composer-dependency }}

      - name: Execute tests
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_DATABASE: web
          DB_USERNAME: web
          DB_PASSWORD: web
